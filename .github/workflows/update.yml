name: Update archive and deploy

on:
  schedule:
    - cron: "0 16 * * *"   # 00:00 Malaysia time, daily
  workflow_dispatch: {}     # the "Run workflow" button = update now
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config.json", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Update video list
        run: node scripts/update.js
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data site/thumbs
          git diff --cached --quiet || (git commit -m "chore: daily update" && git pull --rebase && git push)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
