name: Update archive and deploy

on:
  schedule:
    - cron: "0 16 * * *"   # 00:00 Malaysia time, daily
  workflow_dispatch: {}     # the "Run workflow" button = update now
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Update video list
        run: node scripts/update.js
      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/thumbs
          git diff --cached --quiet || (git commit -m "chore: daily update" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
